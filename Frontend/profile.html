<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediSlot - Patient Profile</title>
     <link href = "css/style.css" rel = "stylesheet">
</head>
<body>
    <div class="layout">

    <aside class="sidebar">
      <div class="brand">MediSlot</div>
      <nav>
        <a href="patient.html" class="nav-link ">🩺 Doctors</a>
        <a href="appointment.html" class="nav-link">📅 My Appointments</a>
        <a href="profile.html" class="nav-link active">👤 My Profile</a>
      </nav>
      <button type="button" class="logout">👤 Logout</button>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 class="page-title">My Profile</h1>
        <span class="role-badge">Patient</span>
      </header>

      <main class="content">
        <p id = "message"></p>
        <div class = "form-card">
            <label>Name</label>
            <input type = "text" id = "namefield" disabled>

            <label>Email</label>
            <input type = "email" id = "emailfield" disabled>

            <label>Age</label>
            <input type = "number" id = "agefield">

            <label>Phone</label>
            <input type = "tel" id = "phonefield">

            <button type = "button" id = "saveBtn">Save</button>

             </main>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>


        </div>
</body>
</html>
